[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-evidence-guard"
version = "0.1.0"
description = "Local contract-based verification of tool results and exact claims"
requires-python = ">=3.10"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "Pedro Sordo Martínez", email = "amurlaniakea@gmail.com"}]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/amurlaniakea/tool-evidence-guard"
Repository = "https://github.com/amurlaniakea/tool-evidence-guard"
Issues = "https://github.com/amurlaniakea/tool-evidence-guard/issues"
Paper = "https://arxiv.org/abs/2609.14758"

[project.scripts]
tool-evidence-guard = "tool_evidence_guard.cli:main"

[tool.setuptools.packages.find]
include = ["tool_evidence_guard*"]
